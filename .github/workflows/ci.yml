name: Linux CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libgtest-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Native C++ Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Integration tests
        env:
          RAILDIAG_BINARY: ${{ github.workspace }}/build/raildiag-gateway
        run: PYTHONPATH=python python3 -m unittest discover -s tests -v
